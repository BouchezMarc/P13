services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: chess-agent-backend

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    env_file:
      - ./backend/.env

    environment:
      PYTHONPATH: /app

    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/data:/app/data

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    depends_on:
      - milvus

    restart: unless-stopped


  etcd:
    container_name: chess-agent-etcd

    image: quay.io/coreos/etcd:v3.5.5

    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000

    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd

    volumes:
      - milvus-etcd:/etcd


  minio:
    container_name: chess-agent-minio

    image: minio/minio:RELEASE.2023-03-20T20-16-18Z

    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

    command: minio server /minio_data

    volumes:
      - milvus-minio:/minio_data


  milvus:
    container_name: chess-agent-milvus

    image: milvusdb/milvus:v2.4.15

    command: ["milvus", "run", "standalone"]

    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000

    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_HTTP_PORT:-9091}:9091"

    depends_on:
      - etcd
      - minio

    volumes:
      - milvus-data:/var/lib/milvus

    restart: unless-stopped

  mongo:
    container_name: chess-agent-mongo
    image: mongo:8

    ports:
      - "${MONGO_PORT:-27017}:27017"

    volumes:
      - mongo-data:/data/db

    restart: unless-stopped

  frontend:
    container_name: chess-agent-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "${FRONTEND_PORT:-4200}:80"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  milvus-etcd:
  milvus-minio:
  milvus-data:
  mongo-data: